<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Actas de entrega</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Se estampa el tema antes de pintar. Si esto viviera en React, el primer cuadro saldría
      // con el tema por defecto y el usuario vería un parpadeo blanco al recargar en oscuro.
      (function () {
        try {
          var guardado = localStorage.getItem("firma.tema");
          if (guardado === "claro" || guardado === "oscuro") {
            document.documentElement.dataset.theme = guardado === "claro" ? "light" : "dark";
          }
        } catch (e) {
          /* sin localStorage se queda en el tema del sistema */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
